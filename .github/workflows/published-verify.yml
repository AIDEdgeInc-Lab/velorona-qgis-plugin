# Stage C - verify what plugin USERS actually get from the QGIS Plugin Repository (plugins.qgis.org), not what we built.
# Reads the same public feed the Velorona Map stats job uses (plugins.xml?qgis=4.0), downloads the published zip and runs the
# same structural verification as Stage B on it. Read-only: one feed request and one zip download per run.
#
# Failure classification (written to the run summary): feed/download failure = EXTERNAL (plugins.qgis.org); structural failure
# = DEFECT in what was published. Either way an issue is opened (or commented) so it cannot go unnoticed.
name: Published plugin verification

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/published-verify.yml"]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the published listing and verify the zip
        id: verify
        run: |
          set +e
          python3 - <<'PY' 2>&1 | tee verify.log
          import sys, urllib.request, xml.etree.ElementTree as ET
          UA = {"User-Agent": "velorona-plugin-verify/1.0 (+https://github.com/AIDEdgeInc-Lab/velorona-qgis-plugin)"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          try:
              feed = ET.fromstring(get("https://plugins.qgis.org/plugins/plugins.xml?qgis=4.0"))
              entries = [e for e in feed.iter("pyqgis_plugin") if e.get("name", "").lower() == "velorona"]
              if not entries:
                  print("CLASS=EXTERNAL plugin 'Velorona' not present in plugins.xml?qgis=4.0"); sys.exit(2)
              e = entries[-1]
              version = e.get("version", "").strip()
              url = (e.findtext("download_url") or "").strip()
              if not version or not url.startswith("https://"):
                  print(f"CLASS=EXTERNAL feed entry incomplete: version={version!r} url={url!r}"); sys.exit(2)
              open("published.zip", "wb").write(get(url))
              open("published.version", "w").write(version)
              print(f"published listing: Velorona {version} <- {url}")
          except Exception as exc:
              print(f"CLASS=EXTERNAL could not read the plugin repository: {type(exc).__name__}: {exc}"); sys.exit(2)
          PY
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python3 tools/verify_package.py published.zip "$(cat published.version)" 2>&1 | tee -a verify.log
            rc=${PIPESTATUS[0]}
            [ "$rc" -ne 0 ] && echo "CLASS=DEFECT the published zip fails structural verification" | tee -a verify.log
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo '### Published plugin verification'; echo '```'; cat verify.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Open or update an issue on failure (scheduled runs only)
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Published plugin verification failing"
          # shellcheck disable=SC2016  # the backticks are literal Markdown fences
          body="$(printf 'The scheduled verification of the published Velorona plugin failed.\n\nRun: %s\n\n```\n%s\n```\n' "$RUN_URL" "$(tail -n 30 verify.log)")"
          n="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
