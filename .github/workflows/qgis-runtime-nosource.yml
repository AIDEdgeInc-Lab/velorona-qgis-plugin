# (run 2: teardown fixes)
# Real QGIS 4.x runtime tests that need NO access to the orbital source (the source is blocked inside the container, so this workflow can never send it a
# request). Runs ONLY when this file changes on the probe branch. Every step continues on error so one run reports everything.
name: Real QGIS runtime (no source access)
on:
  push:
    branches: [claude/qgis-live-probe]
    paths: [".github/workflows/qgis-runtime-nosource.yml"]
permissions:
  contents: read
jobs:
  qgis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPS: requests skyfield sgp4 "aei-link-clearance>=0.2.0,<0.3" "aei-microwave-link-exposure>=0.2.0,<0.3" aei-geo-features pytest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the QGIS 4.0 image
        run: docker pull qgis/qgis:4.0 && docker run --rm qgis/qgis:4.0 python3 -c "from qgis.core import Qgis; import sys; print('QGIS', Qgis.version(), 'python', sys.version.split()[0])"
      - name: unit tests + Qt enum check (QGIS image)
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work/velorona -w /work/velorona qgis/qgis:4.0 bash -c "set -o pipefail
            python3 -m pip install --quiet --break-system-packages $DEPS
            python3 tools/check_qt6_enums.py && python3 -m pytest tests -q -rs -p no:cacheprovider 2>&1 | tail -8"
      - name: qgis_e2e.py (existing suite; orbital source blocked)
        continue-on-error: true
        run: |
          docker run --rm --add-host celestrak.org:127.0.0.1 -v "$GITHUB_WORKSPACE":/work/velorona -e QT_QPA_PLATFORM=offscreen -w /work/velorona qgis/qgis:4.0 bash -c "set -o pipefail
            python3 -m pip install --quiet --break-system-packages $DEPS
            python3 tests/qgis_e2e.py 2>&1 | grep -E 'FAIL|SKIP|checks passed|FAILED|Error|Traceback' | head -60"
      - name: qgis_ui_polish_e2e.py
        continue-on-error: true
        run: |
          docker run --rm --add-host celestrak.org:127.0.0.1 -v "$GITHUB_WORKSPACE":/work/velorona -e QT_QPA_PLATFORM=offscreen -w /work/velorona qgis/qgis:4.0 bash -c "set -o pipefail
            python3 -m pip install --quiet --break-system-packages $DEPS
            python3 tests/qgis_ui_polish_e2e.py 2>&1 | grep -E 'FAIL|SKIP|checks passed|FAILED|Error|Traceback' | head -40"
      - name: qgis_usa_e2e.py
        continue-on-error: true
        run: |
          docker run --rm --add-host celestrak.org:127.0.0.1 -v "$GITHUB_WORKSPACE":/work/velorona -e QT_QPA_PLATFORM=offscreen -w /work/velorona qgis/qgis:4.0 bash -c "set -o pipefail
            python3 -m pip install --quiet --break-system-packages $DEPS
            python3 tests/qgis_usa_e2e.py 2>&1 | grep -E 'FAIL|SKIP|checks passed|FAILED|Error|Traceback' | head -40"
      - name: package + verify
        continue-on-error: true
        run: |
          sh tools/package.sh | tail -3
          python3 tools/verify_package.py "$(ls -t dist/velorona-*.zip | head -1)" | tail -6
