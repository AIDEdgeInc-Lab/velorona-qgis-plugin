# One-shot live check of the orbital source from a GitHub-hosted runner, through the plugin's QGIS-free feed code. Runs ONLY when this file or the
# probe script changes on the probe branch (so it cannot re-request the source on every push). 5 requests (one per GEO group); publishes nothing.
name: Live orbit probe (QGIS feed code)
on:
  push:
    branches: [claude/qgis-live-probe]
    paths: [".github/workflows/live-orbit-probe.yml", "tools/live_orbit_probe.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests skyfield sgp4
      - name: Probe
        run: python tools/live_orbit_probe.py
