# Final-commit verification: this branch is main plus the two probe workflows, so the code under test is main's. Also runnable by hand (workflow_dispatch) so
# it can be repeated when the source is reachable; leave at least an hour between runs (the provider's one-request-per-hour guidance). A source timeout fails the job.
# Real-source + real-QGIS verification on a GitHub-hosted runner (the build sandbox can reach neither). Runs ONLY when this file, the probe script or the
# test files change on the probe branch, so it cannot re-request the source on every push. Source requests: 5 (one per GEO group), made once by the
# probe; every later step reads that cache or is blocked from the source. Publishes and deploys nothing.
#   1. probe        tools/live_orbit_probe.py   real response -> the plugin's own feed code (cache, validation, SGP4); prints counts and headers
#   2. unit tests   pytest tests                (inside the QGIS image; nothing skipped is accepted silently)
#   3. feed e2e     tests/qgis_satellite_feed_e2e.py   REAL QGIS 4.x runtime, plugin pointed at the cache from step 1
#   4. full e2e     tests/qgis_e2e.py           existing end-to-end suite, with the orbital source blocked (so it cannot send a second set of requests)
name: Live orbit probe + real QGIS runtime
on:
  workflow_dispatch:
  push:
    branches: [claude/qgis-live-probe]
    paths: [".github/workflows/live-orbit-probe.yml", "tools/live_orbit_probe.py", "tests/qgis_satellite_feed_e2e.py"]
permissions:
  contents: read
jobs:
  qgis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        run: |
          mkdir -p /tmp/orbitcache && chmod 777 /tmp/orbitcache
          docker pull qgis/qgis:4.0
          docker run --rm qgis/qgis:4.0 python3 -c "from qgis.core import Qgis; import sys; print('QGIS', Qgis.version(), 'python', sys.version.split()[0])"
      - name: 1. probe (real source, one request per GEO group)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work/velorona -v /tmp/orbitcache:/orbitcache -e ORBIT_CACHE_DIR=/orbitcache -w /work/velorona qgis/qgis:4.0 bash -c 'set -o pipefail
            python3 -m pip install --quiet --break-system-packages requests skyfield sgp4 "aei-link-clearance>=0.2.0,<0.3" "aei-microwave-link-exposure>=0.2.0,<0.3" aei-geo-features pytest
            python3 tools/live_orbit_probe.py'
      - name: 2. unit tests (QGIS image)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work/velorona -w /work/velorona qgis/qgis:4.0 bash -c 'set -o pipefail
            python3 -m pip install --quiet --break-system-packages requests skyfield sgp4 "aei-link-clearance>=0.2.0,<0.3" "aei-microwave-link-exposure>=0.2.0,<0.3" aei-geo-features pytest
            python3 -m pytest tests -q -rs -p no:cacheprovider 2>&1 | tail -15'
      - name: 3. satellite feed e2e (real QGIS, real cached records)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work/velorona -v /tmp/orbitcache:/orbitcache -e ORBIT_CACHE_DIR=/orbitcache -e QT_QPA_PLATFORM=offscreen -w /work/velorona qgis/qgis:4.0 bash -c 'set -o pipefail
            python3 -m pip install --quiet --break-system-packages requests skyfield sgp4 "aei-link-clearance>=0.2.0,<0.3" "aei-microwave-link-exposure>=0.2.0,<0.3" aei-geo-features
            python3 tools/run_qgis_suite.py tests/qgis_satellite_feed_e2e.py 2>&1 | tail -60'   # the repo's own classifier: tolerates ONLY a complete N/N pass followed by the documented QGIS 4.0.3 exit abort (docs/QUALITY.md), with a ::warning::
      - name: 4. full existing e2e suite (orbital source blocked)
        continue-on-error: true
        run: |
          docker run --rm --add-host celestrak.org:127.0.0.1 -v "$GITHUB_WORKSPACE":/work/velorona -e QT_QPA_PLATFORM=offscreen -w /work/velorona qgis/qgis:4.0 bash -c 'set -o pipefail
            python3 -m pip install --quiet --break-system-packages requests skyfield sgp4 "aei-link-clearance>=0.2.0,<0.3" "aei-microwave-link-exposure>=0.2.0,<0.3" aei-geo-features
            python3 tests/qgis_e2e.py 2>&1 | tail -70'
